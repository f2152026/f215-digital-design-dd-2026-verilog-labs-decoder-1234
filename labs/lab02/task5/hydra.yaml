# hydra.yaml — Hydra source file configuration
# Paths are relative to this file's directory; absolute paths are accepted verbatim.
# The SQLite database (hydra.db) is always created next to this file.
# Only .v and .sv files are collected. All other types are ignored.
# Exclusions are applied after all inclusions regardless of order.
# Duplicate paths are deduplicated automatically.
#
# Entry forms:
#   ./path/to/file.v      — single file
#   ./path/to/dir/        — all .v/.sv directly in that directory
#   ./path/to/dir/*       — above + .v/.sv one level into sub-directories
#   "!./path/to/file.v"   — exclude a specific file
#   "!./path/to/dir/"     — exclude all files collected from a directory

sources:
  - ./alu.v

# Simulation configuration
start_time: 0           # simulation viewport start time
time_unit: ns           # fs | ps | ns | us | ms | s
working_hierarchy: ""   # top-level module name (REQUIRED before simulation)
max_sim_time: 1000
max_sim_cycles: 5000
waveform_window_size: -1   # initial visible window width (time units); -1 = full timeline
max_frozen_windows: 5      # frozen waveform windows kept across restarts (oldest discarded first); 0 = none, -1 = unlimited
